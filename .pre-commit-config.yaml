# Pre-commit hooks for mnemotree.
#
#   make precommit-install     # once per clone
#   make precommit             # all hooks, all files
#
# Remote hooks pin their own version via `rev`. ruff, mypy and pytest run as
# local hooks through the Makefile, so they use the versions uv.lock installs
# into .venv rather than a second, drifting pin here.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
  # CI is code. The same two linters the workflow-sanity job runs, so a
  # broken workflow is caught before the push rather than by it.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--persona=regular, --min-severity=medium, --min-confidence=medium]
  - repo: local
    hooks:
      - id: workflow-tabs
        name: no tabs in workflow files
        entry: python3 .github/scripts/check_workflow_tabs.py
        language: system
        pass_filenames: false
        files: '^\.github/(workflows|actions)/'
      - id: ruff
        name: ruff
        entry: make lint
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: make format
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: make typecheck
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: make test
        language: system
        pass_filenames: false
