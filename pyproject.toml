[project]
name = "mnemotree"
version = "1.0.0"
description = "Persistent, source-first memory for LLM agents"
authors = [
    { name = "kurcontko", email = "mikeqrc@gmail.com" }
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "sqlite-vec>=0.1.9,<0.2.0",
    "tiktoken>=0.7.0,<1.0.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
embeddings = ["httpx>=0.27,<1.0", "tenacity>=9.2.1,<10"]
serve = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]
# Local SentenceTransformer embedder (evidence.providers.SentenceTransformerEmbedder)
lite = ["sentence-transformers>=2.7.0"]
dev = [
    "build>=1.4.0,<2",
    "httpx>=0.27,<1.0",
    "tenacity>=9.2.1,<10",
    "fastapi>=0.115,<1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.20.0",
    "ruff>=0.15.10",
    "pre-commit>=3.7.0",
    "virtualenv>=21.14.9,<22.0.0",
]
all = ["mnemotree[embeddings,serve,lite]"]

[tool.uv]
package = true

[project.urls]
Homepage = "https://github.com/kurcontko/mnemotree"
Repository = "https://github.com/kurcontko/mnemotree.git"
Issues = "https://github.com/kurcontko/mnemotree/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemotree"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -W error --cov=mnemotree --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE",
    "RUF", "PERF", "FURB", "RET", "PGH", "LOG", "G", "FLY", "ISC", "DTZ", "ASYNC", "BLE",
]
# UP042: StrEnum changes str()/format() output of enum members, which would alter serialized values
# RUF005, FURB167: unpacking over list concatenation and re.IGNORECASE over re.I are
# taste; the rewrites reflow tables of patterns and argv lists for no gain.
ignore = ["E501", "B008", "UP042", "RUF005", "FURB167"]

[tool.ruff.lint.isort]
known-first-party = ["mnemotree"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# CJK and full-width punctuation in fixtures are deliberate test data.
"tests/**" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src/mnemotree"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Optional extras without type information; each is imported only where it is used.
[[tool.mypy.overrides]]
module = ["sqlite_vec", "sentence_transformers", "sentence_transformers.*", "uvicorn"]
ignore_missing_imports = true

[project.scripts]
mnemotree-evidence = "mnemotree.cli.evidence:main"
mnemotree = "mnemotree.cli:main"
mnemotree-mcp = "mnemotree.mcp.server:main"
