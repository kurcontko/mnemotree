[project]
name = "mnemotree"
version = "0.4.0"
description = "Persistent, source-first memory for LLM agents"
authors = [
    { name = "kurcontko", email = "mikeqrc@gmail.com" }
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "sqlite-vec>=0.1.9,<0.2.0",
    "tiktoken>=0.7.0,<1.0.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
embeddings = ["httpx>=0.27,<1.0", "tenacity>=8.2,<10"]
serve = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]
# Local SentenceTransformer embedder (evidence.providers.SentenceTransformerEmbedder)
lite = ["sentence-transformers>=2.7.0"]
dev = [
    "httpx>=0.27,<1.0",
    "tenacity>=8.2,<10",
    "fastapi>=0.115,<1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.20.0",
    "ruff>=0.15.10",
    "pre-commit>=3.7.0",
    "virtualenv>=21.14.9,<22.0.0",
]
all = ["mnemotree[embeddings,serve,lite]"]

[tool.uv]
package = true

[project.urls]
Homepage = "https://github.com/kurcontko/mnemotree"
#Documentation = "https://mnemotree.readthedocs.io"
Repository = "https://github.com/kurcontko/mnemotree.git"
Issues = "https://github.com/kurcontko/mnemotree/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mnemotree"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -W error --cov=mnemotree --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end/integration smoke tests (may be slower than unit tests)",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE"]
# UP042: StrEnum changes str()/format() output of enum members, which would alter serialized values
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["mnemotree"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src/mnemotree"]
mypy_path = "src"
follow_imports = "skip"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[project.scripts]
mnemotree-evidence = "mnemotree.evidence.cli:main"
mnemotree = "mnemotree.cli:main"
mnemotree-mcp = "mnemotree.mcp.server:main"
