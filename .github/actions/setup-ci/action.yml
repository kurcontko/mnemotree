name: Set up locked CI tools
description: >
  Select Python and a pinned uv, and put the project virtualenv on PATH.
  One place to bump the toolchain, instead of one per job.
inputs:
  python-version:
    description: Python interpreter
    default: "3.12"
  cache-suffix:
    description: >
      Separates the uv cache of lanes that install different extras, so the
      heavy torch lane neither evicts nor bloats the cache the fast lanes use.
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.11.6"
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-suffix: ${{ inputs.cache-suffix }}
        activate-environment: true
