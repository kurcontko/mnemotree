name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "27 2 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The narrow scope that lets the analysis upload its results to the
      # Security tab; `actions: read` lets it read this workflow run.
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflow YAML itself — the same surface
        # workflow-sanity lints, from a different angle (data flow from
        # untrusted event fields into shells and privileged steps).
        language: [ "python", "actions" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
