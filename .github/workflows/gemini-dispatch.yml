name: '🔀 Gemini Dispatch'

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']
  issues:
    types: ['opened', 'reopened']
  issue_comment:
    types: ['created']
  pull_request_review_comment:
    types: ['created']
  pull_request_review:
    types: ['submitted']

defaults:
  run:
    shell: 'bash'

jobs:
  dispatch:
    # PRs: only non-forks
    # Issues: only on open/reopen
    # Comments: only OWNER/MEMBER/COLLABORATOR mentioning @gemini-cli
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      ) ||
      (
        github.event_name == 'issues' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      ) ||
      (
        github.event.sender.type == 'User' &&
        startsWith(
          github.event.comment.body || github.event.review.body || github.event.issue.body,
          '@gemini-cli'
        ) &&
        contains(
          fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association ||
          github.event.review.author_association ||
          github.event.issue.author_association
        )
      )
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ steps.extract_command.outputs.command }}'
      additional_context: '${{ steps.extract_command.outputs.additional_context }}'
      issue_number: '${{ github.event.pull_request.number || github.event.issue.number }}'

    steps:
      - name: 'Extract command'
        id: 'extract_command'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea'
        env:
          EVENT_TYPE: '${{ github.event_name }}.${{ github.event.action }}'
          REQUEST: >-
            ${{ github.event.comment.body || github.event.review.body ||
                github.event.issue.body || '' }}
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            const request   = (process.env.REQUEST || '').trim();

            core.setOutput('request', request);

            if (eventType === 'pull_request.opened' || eventType === 'pull_request.reopened') {
              core.setOutput('command', 'review');
            } else if (['issues.opened', 'issues.reopened'].includes(eventType)) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith('@gemini-cli /review')) {
              core.setOutput('command', 'review');
              core.setOutput('additional_context', request.replace(/^@gemini-cli \/review/, '').trim());
            } else if (request.startsWith('@gemini-cli /triage')) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith('@gemini-cli')) {
              core.setOutput('command', 'invoke');
              core.setOutput('additional_context', request.replace(/^@gemini-cli/, '').trim());
            } else {
              core.setOutput('command', 'fallthrough');
            }

      - name: 'Acknowledge request'
        if: >-
          ${{ github.event_name != 'pull_request' && github.event_name != 'issues' }}
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |
          gh issue comment "${ISSUE_NUMBER}" \
            --body "🤖 Hi @${{ github.actor }}, I've received your request and I'm working on it now! Track progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            --repo "${REPOSITORY}"

  review:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''review'' }}'
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  triage:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''triage'' }}'
    uses: './.github/workflows/gemini-triage.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  invoke:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''invoke'' }}'
    uses: './.github/workflows/gemini-invoke.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  fallthrough:
    needs: ['dispatch', 'review', 'triage', 'invoke']
    if: >-
      ${{ always() && !cancelled() &&
          (failure() || needs.dispatch.outputs.command == 'fallthrough') }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Send failure comment'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |
          gh issue comment "${ISSUE_NUMBER}" \
            --body "🤖 I'm sorry @${{ github.actor }}, I was unable to process your request. Please [see the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
            --repo "${REPOSITORY}"
