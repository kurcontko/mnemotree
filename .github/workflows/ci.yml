name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Typecheck
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        extras: ["dev", "dev,ner_spacy"]
        exclude:
          # Only test with spacy on 3.12 to save CI minutes
          - python-version: "3.10"
            extras: "dev,ner_spacy"
          - python-version: "3.11"
            extras: "dev,ner_spacy"
          - python-version: "3.13"
            extras: "dev,ner_spacy"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Install spacy model
        if: contains(matrix.extras, 'ner_spacy')
        run: python -m spacy download en_core_web_sm

      - name: Run tests
        run: pytest --cov-report=xml:coverage.xml --junitxml=pytest-report.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.extras }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-${{ matrix.python-version }}-${{ matrix.extras }}
          path: pytest-report.xml
          if-no-files-found: warn
