name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          activate-environment: true

      # Wheels only from uv.lock: no third-party build scripts run in CI.
      # The project itself is imported from src/ via PYTHONPATH instead of being built.
      - name: Install dev dependencies (from uv.lock)
        run: uv sync --locked --no-build --no-install-project --extra dev

      - name: Run lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run typecheck
        run: |
          mypy src

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          pytest --cov-report=xml:coverage.xml --junitxml=pytest-report.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Upload test report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-report-${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: warn
